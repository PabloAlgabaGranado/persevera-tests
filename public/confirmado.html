<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Correo confirmado en Persevera Tests</title>
  <!--
    Copiado de Persevera (public/confirmado.html) el 13-oct-2026, rama
    claude/dia-d en 54e448e. Copiar, nunca mover. Cambiado aquí: los colores
    (los de la paleta de Tests, docs/marca/paleta.md), el nombre, los textos,
    el enlace del botón y el lema, que era de Persevera y bajaba de 13 px.
    El funcionamiento es el de allí:

    Página ESTÁTICA de confirmación del correo. El enlace del correo de registro
    apunta aquí (emailRedirectTo). Supabase YA confirma el correo en su endpoint
    /verify ANTES de redirigir, así que aquí solo se muestra el aviso. NO se carga
    el cliente de Supabase a propósito: si no, detectSessionInUrl iniciaría sesión
    en la web, y queremos que el usuario entre donde de verdad quiere (la app),
    iniciando sesión él.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --fondo: #0F2A31;
      --superficie: #16363E;
      --borde: #2E545C;
      --texto: #F1FAF7;
      --texto-suave: #9DBAB5;
      --marca: #7AD8D2;
      --marca-pulsada: #5BA899;
      --etiqueta: #1C3F43;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: max(28px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    }
    .wrap { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
    .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .brand img { width: 64px; height: 64px; border-radius: 16px; display: block; }
    .brand .wordmark { font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-size: 38px; font-weight: 600; color: var(--texto); line-height: 1; letter-spacing: -0.01em; }
    .brand .wordmark span { color: var(--marca); }
    .card {
      width: 100%;
      background: var(--superficie);
      border: 1px solid var(--borde);
      border-radius: 20px;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .check {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--etiqueta);
      display: flex; align-items: center; justify-content: center;
    }
    .check svg { width: 30px; height: 30px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 700; color: var(--texto); margin: 2px 0 0; }
    .text { font-size: 15px; color: var(--texto-suave); line-height: 1.55; margin: 0; }
    .btn {
      margin-top: 6px;
      display: inline-block;
      width: 100%;
      background: var(--marca);
      color: var(--fondo);
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 16px;
      border-radius: 12px;
      transition: background 0.15s ease;
    }
    .btn:hover, .btn:active { background: var(--marca-pulsada); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <img src="/favicon.svg" alt="" />
      <div class="wordmark">Persevera <span>Tests</span></div>
    </div>

    <div class="card">
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F1FAF7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      </div>
      <h1 class="title">Correo confirmado</h1>
      <p class="text">Tu cuenta ya está lista. Abre Persevera Tests e inicia sesión para empezar.</p>
      <a class="btn" href="https://tests.perseveraoposiciones.com">Iniciar sesión</a>
    </div>
  </main>
</body>
</html>
