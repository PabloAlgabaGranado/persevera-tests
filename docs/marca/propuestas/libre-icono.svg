<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icono de Persevera Tests: «La hoja bajo la luz».
  La pantalla del flexo de Persevera (mismo path y barra), en el verde académico, ilumina una hoja de respuestas
  con tres filas de casillas A-B-C-D y una marcada en cada fila. Los tres colores de Persevera reordenados:
  el verde palo de su flexo pasa a ser el fondo, el verde académico pasa al flexo y el azul tinta marca las respuestas.
  Lienzo 1024x1024, sin transparencia (las tiendas redondean las esquinas).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><defs><linearGradient id="luzTests" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient></defs><rect width="1024" height="1024" fill="#E8F5F1"/><polygon points="324,436 700,436 880,960 144,960" fill="url(#luzTests)"/><path d="M 432 162 L 592 162 L 700 432 L 324 432 Z" fill="#0D7C66"/><rect x="312" y="420" width="400" height="16" fill="#0A6352"/><circle cx="317" cy="560" r="48" fill="#A9BEC5"/><circle cx="317" cy="560" r="29" fill="#FFFFFF"/><circle cx="447" cy="560" r="48" fill="#1B2A4A"/><circle cx="577" cy="560" r="48" fill="#A9BEC5"/><circle cx="577" cy="560" r="29" fill="#FFFFFF"/><circle cx="707" cy="560" r="48" fill="#A9BEC5"/><circle cx="707" cy="560" r="29" fill="#FFFFFF"/><circle cx="317" cy="690" r="48" fill="#A9BEC5"/><circle cx="317" cy="690" r="29" fill="#FFFFFF"/><circle cx="447" cy="690" r="48" fill="#A9BEC5"/><circle cx="447" cy="690" r="29" fill="#FFFFFF"/><circle cx="577" cy="690" r="48" fill="#A9BEC5"/><circle cx="577" cy="690" r="29" fill="#FFFFFF"/><circle cx="707" cy="690" r="48" fill="#1B2A4A"/><circle cx="317" cy="820" r="48" fill="#1B2A4A"/><circle cx="447" cy="820" r="48" fill="#A9BEC5"/><circle cx="447" cy="820" r="29" fill="#FFFFFF"/><circle cx="577" cy="820" r="48" fill="#A9BEC5"/><circle cx="577" cy="820" r="29" fill="#FFFFFF"/><circle cx="707" cy="820" r="48" fill="#A9BEC5"/><circle cx="707" cy="820" r="29" fill="#FFFFFF"/></svg>