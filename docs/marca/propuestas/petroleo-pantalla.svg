<text x="78" y="441" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#1B2A4A">o al disolverse la Cámara</text>
<text x="78" y="463" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#14652F">Respuesta correcta</text>
